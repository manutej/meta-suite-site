<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta-Prompting Recursion · Meta-Suite</title>
<meta name="description" content="Nine task-agnostic meta-skills that emit the reusable structure solving a whole category of work. Works in Claude Code, the Claude app, Codex, Cursor, ChatGPT and Grok.">
<meta property="og:title" content="Meta-Prompting Recursion · Meta-Suite">
<meta property="og:description" content="Nine task-agnostic meta-skills that emit the reusable structure solving a whole category of work. Works in Claude Code, the Claude app, Codex, Cursor, ChatGPT and Grok.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27 fill=%27%23d4a84b%27/%3E%3C/svg%3E">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--surface:#121214;--raised:#1a1a1d;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);--text:#f5f5f4;--muted:#a1a1a8;--dim:#6b6b72;--gold:#d4a84b;--gold-hover:#e0b85c;--gold-dim:rgba(212,168,75,.18);--info:#7fb5f0;--thought:#b39bfb;--act:#d6a077;--confirm:#9fc99d;--font-sans:"Inter",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--font-display:"Oswald","Inter",sans-serif;--ease:cubic-bezier(.22,1,.36,1);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-feature-settings:"ss01","cv11";}
@keyframes fillA{0%{opacity:0}4%{opacity:1}97%{opacity:1}100%{opacity:0}}
@keyframes fillB{0%{opacity:0}34%{opacity:0}38%{opacity:1}97%{opacity:1}100%{opacity:0}}
@keyframes fillC{0%{opacity:0}67%{opacity:0}71%{opacity:1}97%{opacity:1}100%{opacity:0}}
@keyframes vA{0%{opacity:1}33%{opacity:1}34%{opacity:0}100%{opacity:0}}
@keyframes vB{0%{opacity:0}34%{opacity:0}35%{opacity:1}66%{opacity:1}67%{opacity:0}100%{opacity:0}}
@keyframes vC{0%{opacity:0}67%{opacity:0}68%{opacity:1}100%{opacity:1}}
@keyframes cardGlow{0%{opacity:.16}4%{opacity:.34}34%{opacity:.5}67%{opacity:.9}97%{opacity:.9}100%{opacity:.16}}
@keyframes fwdFade{0%{opacity:0}5%{opacity:1}27%{opacity:1}33%{opacity:0}100%{opacity:0}}
@keyframes fbFade{0%{opacity:0}52%{opacity:0}56%{opacity:1}90%{opacity:1}96%{opacity:0}100%{opacity:0}}
@keyframes modelGlow{0%{opacity:.2}28%{opacity:.2}40%{opacity:.75}52%{opacity:.2}100%{opacity:.2}}
[data-pausable]:hover,[data-pausable]:hover *{animation-play-state:paused !important;}

/* mobile hardening */
html,body{max-width:100%;overflow-x:clip;}
img,svg,pre,code,table{max-width:100%;}
svg{height:auto;}
pre{overflow-x:auto;-webkit-overflow-scrolling:touch;}
@media (max-width:760px){
  header > div > :last-child > a:not(:last-child){display:none!important;}
  [style*="grid-template-columns:1.35fr 1fr"],[style*="grid-template-columns: 1.35fr 1fr"]{grid-template-columns:1fr!important;}
  [style*="grid-template-columns:1.35fr 1fr"] > div,[style*="grid-template-columns: 1.35fr 1fr"] > div{border-right:0!important;}
  [style*="max-width:1080px"],[style*="max-width: 1080px"],
  [style*="max-width:960px"],[style*="max-width: 960px"],
  [style*="max-width:900px"],[style*="max-width: 900px"],
  [style*="max-width:820px"],[style*="max-width: 820px"]{padding-left:18px!important;padding-right:18px!important;}
  [style*="grid-template-columns:1fr auto"],[style*="grid-template-columns: 1fr auto"],
  [style*="grid-template-columns:1fr 1fr"],[style*="grid-template-columns: 1fr 1fr"],
  [style*="minmax(320px"],[style*="minmax(300px"]{grid-template-columns:1fr!important;}
}
@media (max-width:480px){
  [style*="font-size:28px"],[style*="font-size: 28px"]{font-size:22px!important;}
}
</style>
<script>
(function(){if(window.__dsPauseHover)return;window.__dsPauseHover=1;
function set(r,p){var s=r.querySelectorAll("svg");for(var i=0;i<s.length;i++){try{p?s[i].pauseAnimations():s[i].unpauseAnimations();}catch(e){}}}
function on(ev,p){document.addEventListener(ev,function(e){var t=e.target,r=t&&t.closest?t.closest("[data-pausable]"):null;if(!r)return;var x=e.relatedTarget;if(x&&r.contains(x))return;set(r,p);},true);}
on("mouseover",true);on("mouseout",false);})();
</script>
</helmet>
<div data-pausable="true" style="width:100%;height:100%;min-height:420px;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:8px;">
<svg viewBox="0 0 680 420" width="100%" height="100%" style="max-width:680px;display:block;overflow:visible;" font-family="var(--font-sans)" aria-label="Meta-prompting recursion: a prompt scaffold runs into the model; the model returns a sharper scaffold; the version ticks up and more of the scaffold fills in.">

  <text x="40" y="40" font-family="var(--font-mono)" font-size="11" letter-spacing="2.5" fill="var(--gold)">META-PROMPTING</text>
  <text x="40" y="60" font-family="var(--font-mono)" font-size="10" letter-spacing="1" fill="var(--dim)">A PROMPT THAT REFINES ITSELF</text>

  <!-- scaffold card -->
  <rect x="40" y="96" width="250" height="252" rx="14" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"></rect>
  <rect x="40" y="96" width="250" height="252" rx="14" fill="none" stroke="var(--gold)" stroke-width="1.5" style="animation:cardGlow 15s var(--ease) infinite;"></rect>
  <text x="58" y="124" font-family="var(--font-mono)" font-size="10.5" letter-spacing="1.5" fill="var(--gold)">PROMPT SCAFFOLD</text>

  <!-- version chip -->
  <rect x="224" y="106" width="52" height="22" rx="7" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1"></rect>
  <text x="250" y="121" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="500" fill="var(--gold)" style="animation:vA 15s step-end infinite;">v1</text>
  <text x="250" y="121" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="500" fill="var(--gold)" style="opacity:0;animation:vB 15s step-end infinite;">v2</text>
  <text x="250" y="121" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="500" fill="var(--gold)" style="opacity:0;animation:vC 15s step-end infinite;">v3</text>

  <!-- roles -->
  <text x="58" y="158" font-family="var(--font-mono)" font-size="10" letter-spacing="1" fill="var(--dim)">roles</text>
  <g>
    <rect x="58" y="166" width="46" height="15" rx="4" fill="var(--raised)" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="110" y="166" width="46" height="15" rx="4" fill="var(--raised)" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="162" y="166" width="46" height="15" rx="4" fill="var(--raised)" stroke="var(--border)" stroke-width="1"></rect>
  </g>
  <g style="animation:fillA 15s var(--ease) infinite;">
    <rect x="58" y="166" width="46" height="15" rx="4" fill="var(--gold-dim)" stroke="var(--gold)" stroke-width="1"></rect>
    <rect x="110" y="166" width="46" height="15" rx="4" fill="var(--gold-dim)" stroke="var(--gold)" stroke-width="1"></rect>
    <rect x="162" y="166" width="46" height="15" rx="4" fill="var(--gold-dim)" stroke="var(--gold)" stroke-width="1"></rect>
  </g>

  <!-- steps -->
  <text x="58" y="210" font-family="var(--font-mono)" font-size="10" letter-spacing="1" fill="var(--dim)">steps</text>
  <g>
    <rect x="58" y="218" width="34" height="15" rx="4" fill="var(--raised)" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="98" y="218" width="34" height="15" rx="4" fill="var(--raised)" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="138" y="218" width="34" height="15" rx="4" fill="var(--raised)" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="178" y="218" width="34" height="15" rx="4" fill="var(--raised)" stroke="var(--border)" stroke-width="1"></rect>
  </g>
  <g style="animation:fillB 15s var(--ease) infinite;">
    <rect x="58" y="218" width="34" height="15" rx="4" fill="var(--gold-dim)" stroke="var(--gold)" stroke-width="1"></rect>
    <rect x="98" y="218" width="34" height="15" rx="4" fill="var(--gold-dim)" stroke="var(--gold)" stroke-width="1"></rect>
    <rect x="138" y="218" width="34" height="15" rx="4" fill="var(--gold-dim)" stroke="var(--gold)" stroke-width="1"></rect>
    <rect x="178" y="218" width="34" height="15" rx="4" fill="var(--gold-dim)" stroke="var(--gold)" stroke-width="1"></rect>
  </g>

  <!-- slots -->
  <text x="58" y="262" font-family="var(--font-mono)" font-size="10" letter-spacing="1" fill="var(--dim)">slots</text>
  <g>
    <rect x="58" y="270" width="70" height="15" rx="4" fill="var(--raised)" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="134" y="270" width="46" height="15" rx="4" fill="var(--raised)" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="186" y="270" width="22" height="15" rx="4" fill="var(--raised)" stroke="var(--border)" stroke-width="1"></rect>
  </g>
  <g style="animation:fillC 15s var(--ease) infinite;">
    <rect x="58" y="270" width="70" height="15" rx="4" fill="var(--gold-dim)" stroke="var(--gold)" stroke-width="1"></rect>
    <rect x="134" y="270" width="46" height="15" rx="4" fill="var(--gold-dim)" stroke="var(--gold)" stroke-width="1"></rect>
    <rect x="186" y="270" width="22" height="15" rx="4" fill="var(--gold-dim)" stroke="var(--gold)" stroke-width="1"></rect>
  </g>

  <text x="58" y="322" font-family="var(--font-mono)" font-size="10.5" fill="var(--muted)">↑ more of it fills each pass</text>

  <!-- forward arrow: scaffold → model -->
  <defs>
    <marker id="mprAh" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--border-strong)"></path></marker>
    <marker id="mprAhAct" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--act)"></path></marker>
  </defs>
  <line x1="298" y1="182" x2="476" y2="182" stroke="var(--border-strong)" stroke-width="2" marker-end="url(#mprAh)"></line>
  <text x="386" y="170" text-anchor="middle" font-family="var(--font-mono)" font-size="10.5" letter-spacing="1" fill="var(--dim)">run</text>

  <!-- feedback arrow: model bottom → back into the scaffold's right edge -->
  <path d="M540 246 C 505 330, 405 342, 296 310" fill="none" stroke="var(--act)" stroke-width="1.6" stroke-dasharray="4 5" opacity=".55" marker-end="url(#mprAhAct)"></path>
  <text x="428" y="356" text-anchor="middle" font-family="var(--font-mono)" font-size="11" letter-spacing="0.5" fill="var(--act)">refine · fold back in</text>

  <!-- model node (bigger, no movement — just a glow pulse) -->
  <circle cx="540" cy="182" r="70" fill="none" stroke="var(--gold-dim)" stroke-width="1.5" style="animation:modelGlow 5s var(--ease) infinite;"></circle>
  <circle cx="540" cy="182" r="56" fill="var(--raised)" stroke="var(--gold)" stroke-width="1.5"></circle>
  <text x="540" y="178" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="500" fill="var(--gold)">MODEL</text>
  <text x="540" y="196" text-anchor="middle" font-family="var(--font-mono)" font-size="9" letter-spacing="1.5" fill="var(--dim)">RUNS IT</text>
  <text x="628" y="172" text-anchor="start" font-size="12" fill="var(--muted)">applies the</text>
  <text x="628" y="188" text-anchor="start" font-size="12" fill="var(--muted)">scaffold to</text>
  <text x="628" y="204" text-anchor="start" font-size="12" fill="var(--gold)">itself</text>

  <!-- forward pulse: card → into model, then absorbed (fades) -->
  <circle r="6" fill="var(--gold)" style="filter:drop-shadow(0 0 7px var(--gold));animation:fwdFade 5s linear infinite;">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="0" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3;1" path="M298 182 L492 182"></animateMotion>
  </circle>
  <!-- feedback pulse: emerges from model bottom, rides the return curve, fades at the card edge -->
  <circle r="6" fill="var(--act)" style="filter:drop-shadow(0 0 7px var(--act));animation:fbFade 5s linear infinite;">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="0" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.54;0.94;1" path="M540 246 C 505 330, 405 342, 296 310"></animateMotion>
  </circle>

  <text x="340" y="404" text-anchor="middle" font-size="12.5" fill="var(--muted)">one prompt, taught to sharpen itself — each pass fills in more of the scaffold</text>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:680,&quot;height&quot;:420}}"></script>
</body>
</html>
