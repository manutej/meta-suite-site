<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revision Loop Explained · Meta-Suite</title>
<meta name="description" content="Nine task-agnostic meta-skills that emit the reusable structure solving a whole category of work. Works in Claude Code, the Claude app, Codex, Cursor, ChatGPT and Grok.">
<meta property="og:title" content="Revision Loop Explained · Meta-Suite">
<meta property="og:description" content="Nine task-agnostic meta-skills that emit the reusable structure solving a whole category of work. Works in Claude Code, the Claude app, Codex, Cursor, ChatGPT and Grok.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27 fill=%27%23d4a84b%27/%3E%3C/svg%3E">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--surface:#121214;--raised:#1a1a1d;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);--text:#f5f5f4;--muted:#a1a1a8;--dim:#6b6b72;--gold:#d4a84b;--gold-hover:#e0b85c;--gold-dim:rgba(212,168,75,.18);--info:#7fb5f0;--thought:#b39bfb;--act:#d6a077;--confirm:#9fc99d;--font-sans:"Inter",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--font-display:"Oswald","Inter",sans-serif;--ease:cubic-bezier(.22,1,.36,1);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-feature-settings:"ss01","cv11";}
@keyframes nodeOn{0%{opacity:1}16%{opacity:1}24%{opacity:0}100%{opacity:0}}
[data-pausable]:hover,[data-pausable]:hover *{animation-play-state:paused !important;}

/* mobile hardening */
html,body{max-width:100%;overflow-x:clip;}
img,svg,pre,code,table{max-width:100%;}
svg{height:auto;}
pre{overflow-x:auto;-webkit-overflow-scrolling:touch;}
@media (max-width:760px){
  header > div > :last-child > a:not(:last-child){display:none!important;}
  [style*="grid-template-columns:1.35fr 1fr"],[style*="grid-template-columns: 1.35fr 1fr"]{grid-template-columns:1fr!important;}
  [style*="grid-template-columns:1.35fr 1fr"] > div,[style*="grid-template-columns: 1.35fr 1fr"] > div{border-right:0!important;}
  [style*="max-width:1080px"],[style*="max-width: 1080px"],
  [style*="max-width:960px"],[style*="max-width: 960px"],
  [style*="max-width:900px"],[style*="max-width: 900px"],
  [style*="max-width:820px"],[style*="max-width: 820px"]{padding-left:18px!important;padding-right:18px!important;}
  [style*="grid-template-columns:1fr auto"],[style*="grid-template-columns: 1fr auto"],
  [style*="grid-template-columns:1fr 1fr"],[style*="grid-template-columns: 1fr 1fr"],
  [style*="minmax(320px"],[style*="minmax(300px"]{grid-template-columns:1fr!important;}
}
@media (max-width:480px){
  [style*="font-size:28px"],[style*="font-size: 28px"]{font-size:22px!important;}
}
</style>
</helmet>
<div data-pausable="true" style="width:100%;height:100%;min-height:540px;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:8px;">
<svg viewBox="0 0 1080 540" width="100%" height="100%" style="max-width:1080px;display:block;overflow:visible;" font-family="var(--font-sans)" aria-label="The revision loop explained. Each stage lights in turn, and the matching row on the right explains, in plain words, what that stage does.">

  <!-- ══════ LEFT: the ring ══════ -->
  <circle cx="300" cy="260" r="130" fill="none" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"></circle>
  <circle cx="300" cy="260" r="130" fill="none" stroke="var(--gold-dim)" stroke-width="1"></circle>

  <!-- node 0 build -->
  <g>
    <circle cx="300" cy="130" r="7" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="300" y="112" text-anchor="middle" font-size="14.5" font-weight="600" fill="var(--dim)">build</text>
    <g style="opacity:0;animation:nodeOn 10s linear infinite;animation-delay:0s;">
      <circle cx="300" cy="130" r="15" fill="var(--gold)" opacity=".2"></circle>
      <circle cx="300" cy="130" r="7" fill="var(--gold)" style="filter:drop-shadow(0 0 5px var(--gold));"></circle>
      <text x="300" y="112" text-anchor="middle" font-size="14.5" font-weight="700" fill="var(--text)">build</text>
    </g>
  </g>
  <!-- node 1 review -->
  <g>
    <circle cx="423.6" cy="219.8" r="7" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="442" y="224" text-anchor="start" font-size="14.5" font-weight="600" fill="var(--dim)">review</text>
    <g style="opacity:0;animation:nodeOn 10s linear infinite;animation-delay:2s;">
      <circle cx="423.6" cy="219.8" r="15" fill="var(--info)" opacity=".2"></circle>
      <circle cx="423.6" cy="219.8" r="7" fill="var(--info)" style="filter:drop-shadow(0 0 5px var(--info));"></circle>
      <text x="442" y="224" text-anchor="start" font-size="14.5" font-weight="700" fill="var(--text)">review</text>
    </g>
  </g>
  <!-- node 2 compound -->
  <g>
    <circle cx="376.4" cy="365.2" r="7" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="394" y="369" text-anchor="start" font-size="14.5" font-weight="600" fill="var(--dim)">compound</text>
    <g style="opacity:0;animation:nodeOn 10s linear infinite;animation-delay:4s;">
      <circle cx="376.4" cy="365.2" r="15" fill="var(--confirm)" opacity=".2"></circle>
      <circle cx="376.4" cy="365.2" r="7" fill="var(--confirm)" style="filter:drop-shadow(0 0 5px var(--confirm));"></circle>
      <text x="394" y="369" text-anchor="start" font-size="14.5" font-weight="700" fill="var(--text)">compound</text>
    </g>
  </g>
  <!-- node 3 context -->
  <g>
    <circle cx="223.6" cy="365.2" r="7" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="205" y="369" text-anchor="end" font-size="14.5" font-weight="600" fill="var(--dim)">context</text>
    <g style="opacity:0;animation:nodeOn 10s linear infinite;animation-delay:6s;">
      <circle cx="223.6" cy="365.2" r="15" fill="var(--thought)" opacity=".2"></circle>
      <circle cx="223.6" cy="365.2" r="7" fill="var(--thought)" style="filter:drop-shadow(0 0 5px var(--thought));"></circle>
      <text x="205" y="369" text-anchor="end" font-size="14.5" font-weight="700" fill="var(--text)">context</text>
    </g>
  </g>
  <!-- node 4 sharpen -->
  <g>
    <circle cx="176.4" cy="219.8" r="7" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="158" y="224" text-anchor="end" font-size="14.5" font-weight="600" fill="var(--dim)">sharpen</text>
    <g style="opacity:0;animation:nodeOn 10s linear infinite;animation-delay:8s;">
      <circle cx="176.4" cy="219.8" r="15" fill="var(--gold)" opacity=".2"></circle>
      <circle cx="176.4" cy="219.8" r="7" fill="var(--gold)" style="filter:drop-shadow(0 0 5px var(--gold));"></circle>
      <text x="158" y="224" text-anchor="end" font-size="14.5" font-weight="700" fill="var(--text)">sharpen</text>
    </g>
  </g>

  <!-- center -->
  <text x="300" y="256" text-anchor="middle" font-family="var(--font-mono)" font-size="10" letter-spacing="3" fill="var(--gold)">REVISION LOOP</text>
  <text x="300" y="282" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="20" fill="var(--text)">build. keep. sharpen.</text>

  <!-- ══════ RIGHT: synced teaching column ══════ -->
  <text x="600" y="58" font-family="var(--font-mono)" font-size="12" letter-spacing="2.5" fill="var(--gold)">READING THE LOOP</text>
  <text x="600" y="82" font-size="14" fill="var(--muted)">Each stage lights in turn; its row explains what it does.</text>

  <!-- row build -->
  <g>
    <rect x="600" y="104" width="452" height="60" rx="10" fill="none" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="600" y="104" width="452" height="60" rx="10" fill="var(--gold-dim)" style="opacity:0;animation:nodeOn 10s linear infinite;animation-delay:0s;"></rect>
    <rect x="600" y="104" width="4" height="60" rx="2" fill="var(--gold)"></rect>
    <text x="622" y="130" font-family="var(--font-mono)" font-size="16" fill="var(--gold)">build</text>
    <text x="686" y="130" font-family="var(--font-mono)" font-size="10" letter-spacing="1.5" fill="var(--dim)">MAKE</text>
    <text x="622" y="150" font-size="13.5" fill="var(--muted)">Make the first working version of the thing.</text>
  </g>
  <!-- row review -->
  <g>
    <rect x="600" y="176" width="452" height="60" rx="10" fill="none" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="600" y="176" width="452" height="60" rx="10" fill="var(--gold-dim)" style="opacity:0;animation:nodeOn 10s linear infinite;animation-delay:2s;"></rect>
    <rect x="600" y="176" width="4" height="60" rx="2" fill="var(--info)"></rect>
    <text x="622" y="202" font-family="var(--font-mono)" font-size="16" fill="var(--info)">review</text>
    <text x="694" y="202" font-family="var(--font-mono)" font-size="10" letter-spacing="1.5" fill="var(--dim)">KEEP</text>
    <text x="622" y="222" font-size="13.5" fill="var(--muted)">Look hard for what is actually wrong.</text>
  </g>
  <!-- row compound -->
  <g>
    <rect x="600" y="248" width="452" height="60" rx="10" fill="none" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="600" y="248" width="452" height="60" rx="10" fill="var(--gold-dim)" style="opacity:0;animation:nodeOn 10s linear infinite;animation-delay:4s;"></rect>
    <rect x="600" y="248" width="4" height="60" rx="2" fill="var(--confirm)"></rect>
    <text x="622" y="274" font-family="var(--font-mono)" font-size="16" fill="var(--confirm)">compound</text>
    <text x="726" y="274" font-family="var(--font-mono)" font-size="10" letter-spacing="1.5" fill="var(--dim)">KEEP</text>
    <text x="622" y="294" font-size="13.5" fill="var(--muted)">Turn each fix into something reusable.</text>
  </g>
  <!-- row context -->
  <g>
    <rect x="600" y="320" width="452" height="60" rx="10" fill="none" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="600" y="320" width="452" height="60" rx="10" fill="var(--gold-dim)" style="opacity:0;animation:nodeOn 10s linear infinite;animation-delay:6s;"></rect>
    <rect x="600" y="320" width="4" height="60" rx="2" fill="var(--thought)"></rect>
    <text x="622" y="346" font-family="var(--font-mono)" font-size="16" fill="var(--thought)">context</text>
    <text x="706" y="346" font-family="var(--font-mono)" font-size="10" letter-spacing="1.5" fill="var(--dim)">KEEP</text>
    <text x="622" y="366" font-size="13.5" fill="var(--muted)">Save what you learned so it carries forward.</text>
  </g>
  <!-- row sharpen -->
  <g>
    <rect x="600" y="392" width="452" height="60" rx="10" fill="none" stroke="var(--border)" stroke-width="1"></rect>
    <rect x="600" y="392" width="452" height="60" rx="10" fill="var(--gold-dim)" style="opacity:0;animation:nodeOn 10s linear infinite;animation-delay:8s;"></rect>
    <rect x="600" y="392" width="4" height="60" rx="2" fill="var(--gold)"></rect>
    <text x="622" y="418" font-family="var(--font-mono)" font-size="16" fill="var(--gold)">sharpen</text>
    <text x="700" y="418" font-family="var(--font-mono)" font-size="10" letter-spacing="1.5" fill="var(--dim)">MAKE</text>
    <text x="622" y="438" font-size="13.5" fill="var(--muted)">Start the next pass smarter than the last.</text>
  </g>

  <!-- footer: define make / keep once -->
  <line x1="40" y1="482" x2="1052" y2="482" stroke="var(--border)" stroke-width="1"></line>
  <circle cx="52" cy="508" r="5" fill="var(--gold)"></circle>
  <text x="66" y="513" font-size="13.5" fill="var(--muted)"><tspan fill="var(--gold)" font-weight="600">Make</tspan> = the two beats that create — build &amp; sharpen.</text>
  <circle cx="470" cy="508" r="5" fill="var(--confirm)"></circle>
  <text x="484" y="513" font-size="13.5" fill="var(--muted)"><tspan fill="var(--confirm)" font-weight="600">Keep</tspan> = the three that improve — review, compound, context.</text>
  <text x="66" y="533" font-size="13" fill="var(--dim)">Every lap is half making, half keeping. That is the whole idea.</text>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:540}}"></script>
</body>
</html>
