<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--surface:#121214;--raised:#1a1a1d;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);--text:#f5f5f4;--muted:#a1a1a8;--dim:#6b6b72;--gold:#d4a84b;--gold-hover:#e0b85c;--gold-dim:rgba(212,168,75,.18);--info:#7fb5f0;--thought:#b39bfb;--act:#d6a077;--confirm:#9fc99d;--font-sans:"Inter",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--font-display:"Oswald","Inter",sans-serif;--ease:cubic-bezier(.22,1,.36,1);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-feature-settings:"ss01","cv11";}
@keyframes kW1{0%{opacity:1}20%{opacity:0}100%{opacity:0}}
@keyframes kW2{0%{opacity:0}20%{opacity:1}40%{opacity:0}100%{opacity:0}}
@keyframes kW3{0%{opacity:0}40%{opacity:1}60%{opacity:0}100%{opacity:0}}
@keyframes kW4{0%{opacity:0}60%{opacity:1}80%{opacity:0}100%{opacity:0}}
@keyframes kW5{0%{opacity:0}80%{opacity:1}100%{opacity:1}}
[data-pausable]:hover,[data-pausable]:hover *{animation-play-state:paused !important;}

/* mobile hardening */
html,body{max-width:100%;overflow-x:hidden;}
img,svg,pre,code,table{max-width:100%;}
svg{height:auto;}
pre{overflow-x:auto;-webkit-overflow-scrolling:touch;}
@media (max-width:760px){
  [style*="max-width:1080px"],[style*="max-width: 1080px"],
  [style*="max-width:960px"],[style*="max-width: 960px"],
  [style*="max-width:900px"],[style*="max-width: 900px"],
  [style*="max-width:820px"],[style*="max-width: 820px"]{padding-left:18px!important;padding-right:18px!important;}
  [style*="grid-template-columns:1fr auto"],[style*="grid-template-columns: 1fr auto"],
  [style*="grid-template-columns:1fr 1fr"],[style*="grid-template-columns: 1fr 1fr"],
  [style*="minmax(320px"],[style*="minmax(300px"]{grid-template-columns:1fr!important;}
}
@media (max-width:480px){
  [style*="font-size:28px"],[style*="font-size: 28px"]{font-size:22px!important;}
}
</style>
</helmet>
<div data-pausable="true" style="width:100%;height:100%;min-height:480px;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:8px;">
<svg viewBox="0 0 720 480" width="100%" height="100%" style="max-width:720px;display:block;overflow:visible;" font-family="var(--font-sans)" aria-label="Two axes as two separate diagrams. Make is a line that arrives at a shipped thing. Keep is a loop that never finishes. Each step lights in turn and names what it does.">

  <text x="360" y="32" text-anchor="middle" font-family="var(--font-mono)" font-size="11" letter-spacing="3" fill="var(--gold)">TWO AXES · TWO SHAPES</text>

  <!-- ══════════ MAKE PANEL ══════════ -->
  <rect x="24" y="52" width="320" height="404" rx="16" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"></rect>
  <text x="48" y="90" font-family="var(--font-mono)" font-size="12" letter-spacing="2.5" fill="var(--gold)">MAKE</text>
  <text x="48" y="108" font-family="var(--font-mono)" font-size="10" letter-spacing="1.5" fill="var(--dim)">A LINE · YOU ARRIVE, THEN DONE</text>

  <!-- live caption -->
  <text x="48" y="140" font-family="var(--font-mono)" font-size="14.5" font-weight="500" fill="var(--gold)" style="animation:kW1 10s step-end infinite;">→ frame how to think</text>
  <text x="48" y="140" font-family="var(--font-mono)" font-size="14.5" font-weight="500" fill="var(--gold)" style="opacity:0;animation:kW2 10s step-end infinite;">→ map out the work</text>
  <text x="48" y="140" font-family="var(--font-mono)" font-size="14.5" font-weight="500" fill="var(--gold)" style="opacity:0;animation:kW3 10s step-end infinite;">→ shape the thing</text>
  <text x="48" y="140" font-family="var(--font-mono)" font-size="14.5" font-weight="500" fill="var(--gold)" style="opacity:0;animation:kW4 10s step-end infinite;">→ build version one</text>
  <text x="48" y="140" font-family="var(--font-mono)" font-size="14.5" font-weight="500" fill="var(--gold)" style="opacity:0;animation:kW5 10s step-end infinite;">→ ship it</text>

  <!-- track -->
  <line x1="78" y1="400" x2="78" y2="200" stroke="var(--border-strong)" stroke-width="2" stroke-linecap="round"></line>
  <text x="78" y="428" text-anchor="middle" font-family="var(--font-mono)" font-size="10" letter-spacing="1" fill="var(--dim)">idea</text>

  <!-- make nodes (bottom → top) -->
  <g>
    <circle cx="78" cy="400" r="6.5" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="98" y="404" font-family="var(--font-mono)" font-size="13" fill="var(--dim)">meta-prompting</text>
    <g style="opacity:0;animation:kW1 10s step-end infinite;">
      <circle cx="78" cy="400" r="13" fill="var(--gold)" opacity=".22"></circle>
      <circle cx="78" cy="400" r="6.5" fill="var(--gold)" style="filter:drop-shadow(0 0 5px var(--gold));"></circle>
      <text x="98" y="404" font-family="var(--font-mono)" font-size="13" fill="var(--text)">meta-prompting</text>
    </g>
  </g>
  <g>
    <circle cx="78" cy="350" r="6.5" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="98" y="354" font-family="var(--font-mono)" font-size="13" fill="var(--dim)">meta-planning</text>
    <g style="opacity:0;animation:kW2 10s step-end infinite;">
      <circle cx="78" cy="350" r="13" fill="var(--gold)" opacity=".22"></circle>
      <circle cx="78" cy="350" r="6.5" fill="var(--gold)" style="filter:drop-shadow(0 0 5px var(--gold));"></circle>
      <text x="98" y="354" font-family="var(--font-mono)" font-size="13" fill="var(--text)">meta-planning</text>
    </g>
  </g>
  <g>
    <circle cx="78" cy="300" r="6.5" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="98" y="304" font-family="var(--font-mono)" font-size="13" fill="var(--dim)">meta-design</text>
    <g style="opacity:0;animation:kW3 10s step-end infinite;">
      <circle cx="78" cy="300" r="13" fill="var(--gold)" opacity=".22"></circle>
      <circle cx="78" cy="300" r="6.5" fill="var(--gold)" style="filter:drop-shadow(0 0 5px var(--gold));"></circle>
      <text x="98" y="304" font-family="var(--font-mono)" font-size="13" fill="var(--text)">meta-design</text>
    </g>
  </g>
  <g>
    <circle cx="78" cy="250" r="6.5" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="98" y="254" font-family="var(--font-mono)" font-size="13" fill="var(--dim)">meta-mvp</text>
    <g style="opacity:0;animation:kW4 10s step-end infinite;">
      <circle cx="78" cy="250" r="13" fill="var(--gold)" opacity=".22"></circle>
      <circle cx="78" cy="250" r="6.5" fill="var(--gold)" style="filter:drop-shadow(0 0 5px var(--gold));"></circle>
      <text x="98" y="254" font-family="var(--font-mono)" font-size="13" fill="var(--text)">meta-mvp</text>
    </g>
  </g>
  <!-- shipped target -->
  <g>
    <rect x="70" y="192" width="16" height="16" rx="4" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.5"></rect>
    <text x="98" y="204" font-family="var(--font-mono)" font-size="13" fill="var(--dim)">shipped</text>
    <g style="opacity:0;animation:kW5 10s step-end infinite;">
      <rect x="66" y="188" width="24" height="24" rx="6" fill="var(--gold)"></rect>
      <path d="M72 200 l4 4 l7 -8" fill="none" stroke="#15110a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
      <text x="98" y="204" font-family="var(--font-mono)" font-size="13" fill="var(--text)">shipped</text>
    </g>
  </g>

  <!-- ══════════ KEEP PANEL ══════════ -->
  <rect x="376" y="52" width="320" height="404" rx="16" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"></rect>
  <text x="400" y="90" font-family="var(--font-mono)" font-size="12" letter-spacing="2.5" fill="var(--confirm)">KEEP</text>
  <text x="400" y="108" font-family="var(--font-mono)" font-size="10" letter-spacing="1.5" fill="var(--dim)">A LOOP · IT NEVER FINISHES</text>

  <!-- live caption -->
  <text x="400" y="140" font-family="var(--font-mono)" font-size="14.5" font-weight="500" fill="var(--confirm)" style="animation:kW1 10s step-end infinite;">↺ make the next one easier</text>
  <text x="400" y="140" font-family="var(--font-mono)" font-size="14.5" font-weight="500" fill="var(--confirm)" style="opacity:0;animation:kW2 10s step-end infinite;">↺ raise the quality bar</text>
  <text x="400" y="140" font-family="var(--font-mono)" font-size="14.5" font-weight="500" fill="var(--confirm)" style="opacity:0;animation:kW3 10s step-end infinite;">↺ stress-test the work</text>
  <text x="400" y="140" font-family="var(--font-mono)" font-size="14.5" font-weight="500" fill="var(--confirm)" style="opacity:0;animation:kW4 10s step-end infinite;">↺ ground it in evidence</text>
  <text x="400" y="140" font-family="var(--font-mono)" font-size="14.5" font-weight="500" fill="var(--confirm)" style="opacity:0;animation:kW5 10s step-end infinite;">↺ carry memory forward</text>

  <!-- loop track -->
  <path d="M536 220 A86 86 0 1 1 535.99 220" fill="none" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"></path>
  <text x="536" y="310" text-anchor="middle" font-family="var(--font-mono)" font-size="18" fill="var(--dim)">↺</text>

  <!-- keep nodes -->
  <g>
    <circle cx="536" cy="220" r="6.5" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="536" y="205" text-anchor="middle" font-family="var(--font-mono)" font-size="12.5" fill="var(--dim)">compound</text>
    <g style="opacity:0;animation:kW1 10s step-end infinite;">
      <circle cx="536" cy="220" r="13" fill="var(--confirm)" opacity=".22"></circle>
      <circle cx="536" cy="220" r="6.5" fill="var(--confirm)" style="filter:drop-shadow(0 0 5px var(--confirm));"></circle>
      <text x="536" y="205" text-anchor="middle" font-family="var(--font-mono)" font-size="12.5" fill="var(--text)">compound</text>
    </g>
  </g>
  <g>
    <circle cx="617.8" cy="279.4" r="6.5" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="632" y="276" text-anchor="start" font-family="var(--font-mono)" font-size="12.5" fill="var(--dim)">craft</text>
    <g style="opacity:0;animation:kW2 10s step-end infinite;">
      <circle cx="617.8" cy="279.4" r="13" fill="var(--gold)" opacity=".22"></circle>
      <circle cx="617.8" cy="279.4" r="6.5" fill="var(--gold)" style="filter:drop-shadow(0 0 5px var(--gold));"></circle>
      <text x="632" y="276" text-anchor="start" font-family="var(--font-mono)" font-size="12.5" fill="var(--text)">craft</text>
    </g>
  </g>
  <g>
    <circle cx="586.6" cy="375.6" r="6.5" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="600" y="393" text-anchor="start" font-family="var(--font-mono)" font-size="12.5" fill="var(--dim)">review</text>
    <g style="opacity:0;animation:kW3 10s step-end infinite;">
      <circle cx="586.6" cy="375.6" r="13" fill="var(--info)" opacity=".22"></circle>
      <circle cx="586.6" cy="375.6" r="6.5" fill="var(--info)" style="filter:drop-shadow(0 0 5px var(--info));"></circle>
      <text x="600" y="393" text-anchor="start" font-family="var(--font-mono)" font-size="12.5" fill="var(--text)">review</text>
    </g>
  </g>
  <g>
    <circle cx="485.4" cy="375.6" r="6.5" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="472" y="393" text-anchor="end" font-family="var(--font-mono)" font-size="12.5" fill="var(--dim)">research</text>
    <g style="opacity:0;animation:kW4 10s step-end infinite;">
      <circle cx="485.4" cy="375.6" r="13" fill="var(--thought)" opacity=".22"></circle>
      <circle cx="485.4" cy="375.6" r="6.5" fill="var(--thought)" style="filter:drop-shadow(0 0 5px var(--thought));"></circle>
      <text x="472" y="393" text-anchor="end" font-family="var(--font-mono)" font-size="12.5" fill="var(--text)">research</text>
    </g>
  </g>
  <g>
    <circle cx="454.2" cy="279.4" r="6.5" fill="var(--raised)" stroke="var(--border-strong)" stroke-width="1.5"></circle>
    <text x="440" y="276" text-anchor="end" font-family="var(--font-mono)" font-size="12.5" fill="var(--dim)">context</text>
    <g style="opacity:0;animation:kW5 10s step-end infinite;">
      <circle cx="454.2" cy="279.4" r="13" fill="var(--act)" opacity=".22"></circle>
      <circle cx="454.2" cy="279.4" r="6.5" fill="var(--act)" style="filter:drop-shadow(0 0 5px var(--act));"></circle>
      <text x="440" y="276" text-anchor="end" font-family="var(--font-mono)" font-size="12.5" fill="var(--text)">context</text>
    </g>
  </g>

  <text x="360" y="474" text-anchor="middle" font-size="12" fill="var(--muted)">each step lights in turn and names, in plain words, what it does</text>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:480}}"></script>
</body>
</html>
